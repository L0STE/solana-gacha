[package]
name = "gacha-program"
version = "0.0.1"
edition = "2021"
description = "A Metaplex Core NFT gacha with on-chain ECVRF verification, live inventory and funded timeout refunds"
license = "MIT"
repository = "https://github.com/L0STE/solana-gacha"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lib]
crate-type = ["cdylib"]

[dependencies]
brine-ed25519 = "0.9.3"
gacha-core = { workspace = true }
pinocchio = { workspace = true }
pinocchio-associated-token-account = "0.2.0"
pinocchio-system = "0.2.3"
pinocchio-token = "0.3.0"
solana-ecvrf = { workspace = true }

[target.'cfg(not(target_os = "solana"))'.dependencies]
sha2 = { version = "0.10", default-features = false }
