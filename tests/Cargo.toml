[package]
name = "gacha-tests"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = "2"
gacha-core = { workspace = true }
gacha-rust = { workspace = true, features = ["rpc"] }
solana-ecvrf = { workspace = true, features = ["prove"] }
mollusk-svm = "0.15.1"
mollusk-svm-programs-token = "0.15.1"
solana-instruction = "3"
solana-account = "4"
solana-pubkey = "4"
solana-sha256-hasher = "3"
solana-program-error = "3"
solana-message = { version = "4.4", features = ["wincode"] }

[dev-dependencies]
mpl-core = "0.12.1"
base64 = "0.22"
mollusk-svm-bencher = "0.15.1"
serde_json = "1"
solana-rpc-client = { version = "=4.2.2", default-features = false }
tokio = { version = "1", features = ["macros", "rt"] }

[[bench]]
name = "compute_units"
harness = false
